# Publications shown on /publications/. The page builds itself from this file.
#
# To add a paper, copy an entry below, paste it at the TOP of the list (newest first), and edit it.
#   title, authors, venue, year   as they should appear on the page
#   abbr     short venue name shown in brackets, e.g. CVPR, TPAMI (optional)
#   type     journal, conference, preprint or thesis   (drives the filters and the figures in the banner)
#   notes    e.g. [Oral] or [Oral, Spotlight]           (optional; "Oral" is counted in the banner)
#   awards   e.g. ["Best Paper Award"]                  (optional; shown as gold badges)
#   links    one "- label / url" pair per button; leave url as "" to show a dashed "not available yet" button
#   bibtex   paste the BibTeX under "bibtex: |-", indented by four spaces
#   selected true to feature the paper under "Selected work" on the homepage (optional)
#   teaser   an image for that card, e.g. /images/teasers/ridnet.jpg, ideally 16:9 (optional)
#
# Lines starting with # are notes and are ignored.

