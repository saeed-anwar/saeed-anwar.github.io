<div class="navigation-wrapper">
  <div class="site-name">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </div><!-- /.site-name -->
  <div class="top-navigation">
    <nav id="site-nav" class="nav" aria-label="Main">
      <button type="button" class="navtoogle navtoggle navicon-lines-button x" aria-expanded="false" aria-controls="site-nav-list"><span class="navicon-lines" aria-hidden="true"></span>Menu</button>
      <ul id="site-nav-list">
        {%- for link in site.links %}
        <li><a href="{% if link.external %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if page.url == link.url %} aria-current="page"{% endif %}{% if link.external %} rel="noopener"{% endif %}>{{ link.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div><!-- /.top-navigation -->
</div><!-- /.navigation-wrapper -->
