<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<script>document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/, 'js');</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Sans+Narrow:400,700%7CPT+Serif:400,700,400italic&amp;display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/academicons.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/images/apple-icon-precomposed.png' | relative_url }}">
{%- if page.url == "/" %}
{%- assign o = site.owner %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ o.name | jsonify }},
  "url": {{ "/" | absolute_url | jsonify }},
  "image": {{ "/images/" | append: o.avatar | absolute_url | jsonify }},
  "jobTitle": {{ o.job_title | jsonify }},
  "worksFor": { "@type": "CollegeOrUniversity", "name": {{ o.employer | jsonify }} },
  "email": {{ "mailto:" | append: o.email | jsonify }},
  "sameAs": {{ site.social.links | jsonify }}
}
</script>
{%- endif %}
