<script>
/* Mobile menu: the button only shows on narrow screens (see main.min.css). */
(function () {
  var nav = document.getElementById('site-nav');
  var btn = nav && nav.querySelector('.navtoogle');
  if (!btn) return;
  function setOpen(open) {
    btn.classList.toggle('active', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', function () { setOpen(!btn.classList.contains('active')); });
  document.addEventListener('click', function (e) { if (!nav.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && btn.classList.contains('active')) { setOpen(false); btn.focus(); }
  });
})();
</script>
{%- if site.google_analytics contains 'G-' %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{%- endif %}
